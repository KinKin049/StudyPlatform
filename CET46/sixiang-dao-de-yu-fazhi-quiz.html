  mode: 'all',          // all | random | wrong
  typeFilter: 'all',    // all | single | multi | judge
  chapterFilter: 'all',
  answers: {},          // { questionId: userAnswer }
  results: {},          // { questionId: 'correct' | 'wrong' }
  showAnswer: {},       // { questionId: true/false }
};

// ===== Data =====
let allQuestions = [];
let wrongQuestions = [];

function getQuestionId(q, index) {
  return `${q.chapter}_${q.type}_${q.num}`;
}

function initData() {
  allQuestions = QUIZ_DATA.map((q, i) => ({
    ...q,
    _id: getQuestionId(q, i),
    _index: i,
  }));
  loadState();
  render();
}

// ===== State Persistence =====
function loadState() {
  try {
    const saved = localStorage.getItem(STATE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function resetProgress() {
  if (!confirm('确定要重置所有进度吗？')) return;
  state.answers = {};
  state.results = {};
  state.showAnswer = {};
  saveState();
  render();
}

// ===== Filtering =====
function getFilteredQuestions() {
  let qs = allQuestions;

  // Chapter filter
  if (state.currentChapter !== 'all') {
    qs = qs.filter(q => q.chapter === state.currentChapter);
  }

  // Type filter
  if (state.typeFilter !== 'all') {
    qs = qs.filter(q => q.type === state.typeFilter);
  }

  // Mode
  if (state.mode === 'wrong') {
    const wrongIds = new Set(Object.entries(state.results).filter(([k,v]) => v === 'wrong').map(([k]) => k));
    qs = qs.filter(q => wrongIds.has(q._id));
  }

  return qs;
}

function getDisplayQuestions() {
  let qs = getFilteredQuestions();
  if (state.mode === 'random') {
    qs = [...qs].sort(() => Math.random() - 0.5);
  }
  return qs;
}

// ===== Rendering =====
function render() {
  renderStats();
  renderSidebar();

  const container = document.getElementById('questionsContainer');
  const displayQs = getDisplayQuestions();

  if (displayQs.length === 0) {
    if (state.mode === 'wrong' && Object.keys(state.results).length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>还没有做过题，先去做几道吧！</p></div>';
    } else if (state.mode === 'wrong') {
      container.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>错题集为空，你真棒！</p></div>';
    } else {
      container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>没有符合条件的题目</p></div>';
    }
    return;
  }

  // Section title
  let title = state.currentChapter === 'all' ? '全部章节' : state.currentChapter;
  if (state.typeFilter !== 'all') {
    const typeNames = { single: '单选题', multi: '多选题', judge: '判断题' };
    title += ' · ' + typeNames[state.typeFilter];
  }

  let html = `<div class="section-title">
    <span>${title}</span>
    <span class="totals">共 ${displayQs.length} 题</span>
  </div>`;

  // Filter buttons for quick type switching
  html += `<div class="filter-btns">
    <button class="filter-btn ${state.typeFilter === 'all' ? 'active' : ''}" onclick="setTypeFilter('all')">全部</button>
    <button class="filter-btn ${state.typeFilter === 'single' ? 'active' : ''}" onclick="setTypeFilter('single')">单选题</button>
    <button class="filter-btn ${state.typeFilter === 'multi' ? 'active' : ''}" onclick="setTypeFilter('multi')">多选题</button>
    <button class="filter-btn ${state.typeFilter === 'judge' ? 'active' : ''}" onclick="setTypeFilter('judge')">判断题</button>
  </div>`;

  displayQs.forEach((q, idx) => {
    html += renderQuestion(q, idx, displayQs.length);
  });

  container.innerHTML = html;
}

function renderQuestion(q, idx, total) {
  const typeNames = { single: '单选题', multi: '多选题', judge: '判断题' };
  const isAnswered = state.answers[q._id] !== undefined;
  const result = state.results[q._id];
  const showAns = state.showAnswer[q._id] || false;

  let cls = 'q-card';
  if (result === 'correct') cls += ' correct';
  if (result === 'wrong') cls += ' wrong';

  let html = `<div class="${cls}" data-id="${q._id}">
    <div class="q-header">
      <span class="q-num">${idx + 1}/${total}</span>
      <span class="q-type-badge ${q.type}">${typeNames[q.type]}</span>
      <span style="color:var(--text-light);font-size:12px;">${q.chapter}</span>
      ${result === 'correct' ? '<span style="color:var(--success);font-size:13px;font-weight:600;">✓</span>' : ''}
      ${result === 'wrong' ? '<span style="color:var(--danger);font-size:13px;font-weight:600;">✗</span>' : ''}
    </div>
    <div class="q-text">${q.num}. ${q.text}</div>`;

  if (q.type === 'judge') {
    html += renderJudgeOptions(q, isAnswered, result, showAns);
  } else {
    html += renderChoiceOptions(q, isAnswered, result, showAns);
  }

  // Answer / Result area
  if (showAns) {
    let resultText = '';
    let resultCls = 'result-info';
    if (result === 'correct') { resultText = '✅ 回答正确！'; resultCls = 'result-correct'; }
    else if (result === 'wrong') { resultText = '❌ 回答错误'; resultCls = 'result-wrong'; }
    else { resultText = '📌 答案'; resultCls = 'result-info'; }

    let answerDisplay = q.answer;
    if (q.type === 'judge') {
      answerDisplay = q.answer === '对' ? '✓ 正确' : '✗ 错误';
    } else if (q.type === 'multi') {
      // Sort the answer letters
      answerDisplay = q.answer.split('').sort().join('');
    }

    html += `<div class="q-answer show ${resultCls}">
      ${resultText}
      ${!result || result === 'wrong' ? `<br><span style="font-weight:600;">正确答案：${answerDisplay}</span>` : ''}
      ${q.type === 'multi' && result === 'wrong' ? `<br><span style="font-size:12px;opacity:.7;">你的答案：${state.answers[q._id] || '无'}</span>` : ''}
    </div>`;
  }

  // Actions
  html += `<div class="q-actions">`;
  if (!showAns && !isAnswered) {
    html += `<button onclick="showAnswerOnly('${q._id}')">👁 看答案</button>`;
  }
  if (isAnswered && !showAns) {
    html += `<button onclick="checkAnswer('${q._id}')">✅ 确认作答</button>`;
  }
  if (showAns) {
    html += `<button onclick="hideAnswer('${q._id}')">🙈 隐藏答案</button>`;
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function renderChoiceOptions(q, isAnswered, result, showAns) {
  const userAns = state.answers[q._id] || '';
  let html = '<ul class="q-options">';
  q.options.forEach(opt => {
    const optLetter = opt.charAt(0);
    const isSelected = userAns.includes(optLetter);
    const isCorrect = q.answer.includes(optLetter);

    let liCls = '';
    if (showAns || result) {
      liCls += ' disabled';
      if (isCorrect) liCls += ' correct-answer';
      if (isSelected && !isCorrect) liCls += ' wrong-answer';
    } else if (isSelected) {
      liCls += ' selected';
    }

    const onClick = (showAns || result) ? '' :
      q.type === 'single'
        ? `onclick="selectSingle('${q._id}','${optLetter}')"`
        : `onclick="selectMulti('${q._id}','${optLetter}')"`;

    html += `<li class="${liCls}" ${onClick}>${opt}</li>`;
  });
  html += '</ul>';
  return html;
}

function renderJudgeOptions(q, isAnswered, result, showAns) {
  const userAns = state.answers[q._id] || '';
  const correctIsTrue = q.answer === '对';
  let html = '<div class="q-judge-btns">';

  ['对', '错'].forEach(val => {
    const isSelected = userAns === val;
    let btnCls = '';
    if (showAns || result) {
      btnCls += ' disabled';
      if ((val === '对' && correctIsTrue) || (val === '错' && !correctIsTrue)) btnCls += ' correct-answer';
      if (isSelected && ((val === '对' && !correctIsTrue) || (val === '错' && correctIsTrue))) btnCls += ' wrong-answer';
    } else if (isSelected) {
      btnCls += val === '对' ? ' selected-true' : ' selected-false';
    }

    const onClick = (showAns || result) ? '' : `onclick="selectJudge('${q._id}','${val}')"`;
    html += `<button class="${btnCls}" ${onClick}>${val === '对' ? '✓' : '✗'} ${val}</button>`;
  });

  html += '</div>';
  return html;
}

// ===== Interactions =====
function selectSingle(qId, letter) {
  state.answers[qId] = letter;
  state.showAnswer[qId] = false;
  delete state.results[qId];
  saveState();
  render();
}

function selectMulti(qId, letter) {
  const current = state.answers[qId] || '';
  let newVal;
  if (current.includes(letter)) {
    newVal = current.replace(letter, '');
  } else {
    newVal = (current + letter).split('').sort().join('');
  }
  state.answers[qId] = newVal || '';
  state.showAnswer[qId] = false;
  delete state.results[qId];
  saveState();
  render();
}

function selectJudge(qId, val) {
  state.answers[qId] = val;
  state.showAnswer[qId] = false;
  delete state.results[qId];
  saveState();
  render();
}

function checkAnswer(qId) {
  const q = allQuestions.find(q => q._id === qId);
  if (!q) return;
  const userAns = state.answers[qId] || '';

  let isCorrect = false;
  if (q.type === 'judge') {
    const expected = q.answer === '对' ? '对' : '错';
    isCorrect = userAns === expected;
  } else if (q.type === 'single') {
    isCorrect = userAns === q.answer;
  } else {
    // Multi: compare sorted letters
    const userSorted = userAns.split('').sort().join('');
    const ansSorted = q.answer.split('').sort().join('');
    isCorrect = userSorted === ansSorted;
  }

  state.results[qId] = isCorrect ? 'correct' : 'wrong';
  state.showAnswer[qId] = true;
  saveState();
  render();
}

function showAnswerOnly(qId) {
  state.showAnswer[qId] = true;
  saveState();
  render();
}

function hideAnswer(qId) {
  state.showAnswer[qId] = false;
  saveState();
  render();
}

// ===== Filters =====
function setTypeFilter(type) {
  state.typeFilter = type;
  saveState();
  render();
}

function changeMode() {
  state.mode = document.getElementById('modeSelect').value;
  saveState();
  render();
}

function applyFilters() {
  state.typeFilter = document.getElementById('typeFilter').value;
  saveState();
  render();
}

function selectChapter(ch) {
  state.currentChapter = ch;
  document.getElementById('modeSelect').value = 'all';
  state.mode = 'all';
  saveState();
  render();
}

// ===== Sidebar =====
function renderSidebar() {
  // Count per chapter
  const chCounts = {};
  const chDone = {};
  allQuestions.forEach(q => {
    chCounts[q.chapter] = (chCounts[q.chapter] || 0) + 1;
  });
  Object.keys(state.results).forEach(id => {
    const ch = id.split('_')[0];
    chDone[ch] = (chDone[ch] || 0) + 1;
  });

  function navHtml(targetId) {
    const container = document.getElementById(targetId);
    let html = `<button class="ch-nav ${state.currentChapter === 'all' ? 'active' : ''}" onclick="selectChapter('all')">
      📚 全部 <span class="badge">${allQuestions.length}</span>
    </button>`;

    CHAPTERS_RAW.forEach(ch => {
      const cnt = chCounts[ch] || 0;
      const done = chDone[ch] || 0;
      const isActive = state.currentChapter === ch;
      html += `<button class="ch-nav ${isActive ? 'active' : ''}" onclick="selectChapter('${ch}')">
        ${ch} <span class="badge">${done}/${cnt}</span>
      </button>`;
    });

    container.innerHTML = html;
  }

  navHtml('chapterNav');
  navHtml('mobileChapterNav');
}

function toggleMobileSidebar() {
  document.getElementById('mobileSidebar').classList.toggle('open');
}

// ===== Stats =====
function renderStats() {
  const total = allQuestions.length;
  const done = Object.keys(state.results).length;
  const correct = Object.values(state.results).filter(v => v === 'correct').length;
  const wrong = Object.values(state.results).filter(v => v === 'wrong').length;
  const singleCnt = allQuestions.filter(q => q.type === 'single').length;
  const multiCnt = allQuestions.filter(q => q.type === 'multi').length;
  const judgeCnt = allQuestions.filter(q => q.type === 'judge').length;

  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('singleCount').textContent = singleCnt;
  document.getElementById('multiCount').textContent = multiCnt;
  document.getElementById('judgeCount').textContent = judgeCnt;
}

// ===== Keyboard shortcuts =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    resetProgress();
  }
});

// ===== Init =====
initData();

</script>
</body>
</html>
