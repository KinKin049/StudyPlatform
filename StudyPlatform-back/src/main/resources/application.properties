spring.application.name=StudyPlatform-back
spring.config.import=optional:file:./application-local.properties,optional:file:./StudyPlatform-back/application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/study_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=520MB

app.storage.root=${APP_STORAGE_ROOT:storage}

spring.mail.host=${QQ_MAIL_HOST:smtp.qq.com}
spring.mail.port=${QQ_MAIL_PORT:587}
spring.mail.username=${QQ_MAIL_USERNAME:}
spring.mail.password=${QQ_MAIL_AUTH_CODE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${QQ_MAIL_HOST:smtp.qq.com}

oj.sandbox-url=${OJ_SANDBOX_URL:}

ai.pet.base-url=${AI_PET_BASE_URL:https://yunwu.ai}
ai.pet.api-key=${AI_PET_API_KEY:}
ai.pet.model=${AI_PET_MODEL:deepseek-v4-flash}

payment.alipay.gateway-url=${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
payment.alipay.app-id=${ALIPAY_APP_ID:}
payment.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
payment.alipay.private-key-path=${ALIPAY_PRIVATE_KEY_PATH:}
payment.alipay.notify-url=${ALIPAY_NOTIFY_URL:}

payment.wechat.base-url=${WECHAT_PAY_BASE_URL:https://api.mch.weixin.qq.com}
payment.wechat.app-id=${WECHAT_PAY_APP_ID:}
payment.wechat.mch-id=${WECHAT_PAY_MCH_ID:}
payment.wechat.serial-no=${WECHAT_PAY_SERIAL_NO:}
payment.wechat.private-key=${WECHAT_PAY_PRIVATE_KEY:}
payment.wechat.private-key-path=${WECHAT_PAY_PRIVATE_KEY_PATH:}
payment.wechat.notify-url=${WECHAT_PAY_NOTIFY_URL:}
# 控制台日志：用于开发调试和项目报告功能展示截图。
logging.level.com.cupk=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
